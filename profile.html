<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的账户 - 小星专注力</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#818CF8',
                        accent: '#FBBF24',
                        success: '#10B981',
                        background: '#F9FAFB',
                        attention: '#3B82F6',
                        memory: '#8B5CF6',
                        reaction: '#10B981',
                        flexibility: '#F59E0B'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Nunito', 'Helvetica Neue', sans-serif;
            background-color: #F9FAFB;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        .child-font {
            font-family: 'Comic Neue', cursive;
        }
        
        .header-gradient {
            background: linear-gradient(135deg, #4F46E5 0%, #818CF8 100%);
        }
        
        .profile-bg {
            background: linear-gradient(135deg, #4F46E5 0%, #818CF8 100%);
            height: 200px;
            border-radius: 0 0 30px 30px;
        }
        
        .avatar-container {
            margin-top: -60px;
            position: relative;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border: 5px solid white;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .badge-icon {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: #FBBF24;
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .star-badge {
            background: linear-gradient(135deg, #FDE68A 0%, #FCD34D 100%);
            border: 2px solid #FBBF24;
        }
        
        .menu-item {
            padding: 16px;
            border-bottom: 1px solid #F3F4F6;
            transition: all 0.3s ease;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:hover {
            background-color: #F9FAFB;
        }
        
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .badge-card {
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            padding: 15px 5px;
            transition: all 0.3s ease;
        }
        
        .badge-card:hover {
            transform: scale(1.05);
        }
        
        .badge-icon-lg {
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .progress-bar {
            height: 8px;
            border-radius: 4px;
            background: #E5E7EB;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #FBBF24 0%, #F59E0B 100%);
            transition: width 0.5s ease;
        }
        
        .floating-action {
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
            transition: all 0.3s ease;
        }
        
        .floating-action:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }
        
        .character-card {
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .character-card.selected {
            border: 3px solid #4F46E5;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.2);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bounce {
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body class="bg-background">
    <!-- 顶部背景 -->
    <div class="profile-bg"></div>

    <!-- 主要内容区域 -->
    <main class="px-5 -mt-20 pb-24">
        <!-- 头像和个人信息 -->
        <div class="avatar-container text-center mb-6">
            <div class="bg-gray-200 border-2 border-dashed rounded-full avatar mx-auto"></div>
            <div class="badge-icon rounded-full text-white">
                <i class="fas fa-medal bounce"></i>
            </div>
            <h1 class="text-2xl font-bold mt-4">小明</h1>
            <p class="text-gray-600">7岁 · 小星训练师</p>
            
            <div class="flex justify-center mt-4">
                <div class="star-badge px-4 py-2 rounded-full flex items-center mx-2">
                    <i class="fas fa-star text-yellow-600 mr-2"></i>
                    <span class="font-bold">256</span>
                </div>
                <div class="bg-blue-100 text-blue-800 px-4 py-2 rounded-full flex items-center mx-2">
                    <i class="fas fa-fire text-orange-500 mr-2"></i>
                    <span class="font-bold">7天</span>
                </div>
            </div>
        </div>
        
        <!-- 成就部分 -->
        <div class="card bg-white mb-6">
            <div class="p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-xl text-gray-800">我的成就</h2>
                    <a href="achievements.html" class="text-primary text-sm font-medium">查看全部</a>
                </div>
                
                <div class="badge-grid">
                    <div class="badge-card bg-amber-50">
                        <div class="badge-icon-lg bg-amber-100 text-amber-600">
                            <i class="fas fa-medal"></i>
                        </div>
                        <h3 class="font-bold text-sm">专注小达人</h3>
                        <p class="text-xs text-gray-500">完成30次专注力训练</p>
                    </div>
                    
                    <div class="badge-card bg-purple-50">
                        <div class="badge-icon-lg bg-purple-100 text-purple-600">
                            <i class="fas fa-brain"></i>
                        </div>
                        <h3 class="font-bold text-sm">记忆大师</h3>
                        <p class="text-xs text-gray-500">记忆游戏通关</p>
                    </div>
                    
                    <div class="badge-card bg-blue-50">
                        <div class="badge-icon-lg bg-blue-100 text-blue-600">
                            <i class="fas fa-infinity"></i>
                        </div>
                        <h3 class="font-bold text-sm">无限潜力</h3>
                        <p class="text-xs text-gray-500">连续训练14天</p>
                    </div>
                    
                    <div class="badge-card bg-gray-100 opacity-50">
                        <div class="badge-icon-lg bg-gray-200 text-gray-400">
                            <i class="fas fa-crown"></i>
                        </div>
                        <h3 class="font-bold text-sm text-gray-400">超级星星</h3>
                        <p class="text-xs text-gray-400">获得500颗星</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 角色装扮 -->
        <div class="card bg-white mb-6">
            <div class="p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-xl text-gray-800">角色装扮</h2>
                    <a href="store.html" class="text-primary text-sm font-medium">商城</a>
                </div>
                
                <div class="flex overflow-x-auto pb-4 space-x-4 -mx-1 px-1">
                    <div class="character-card selected bg-gray-100 rounded-2xl p-4 flex flex-col items-center min-w-max">
                        <div class="w-20 h-20 bg-gradient-to-r from-blue-400 to-indigo-500 rounded-full mb-3"></div>
                        <h3 class="font-bold text-gray-800 text-sm">基础角色</h3>
                        <p class="text-xs text-gray-500">已拥有</p>
                    </div>
                    
                    <div class="character-card bg-gray-100 rounded-2xl p-4 flex flex-col items-center min-w-max">
                        <div class="w-20 h-20 bg-gradient-to-r from-purple-400 to-indigo-500 rounded-full mb-3"></div>
                        <h3 class="font-bold text-gray-800 text-sm">太空冒险家</h3>
                        <p class="text-xs text-gray-500">100 星星</p>
                    </div>
                    
                    <div class="character-card bg-gray-100 rounded-2xl p-4 flex flex-col items-center min-w-max">
                        <div class="w-20 h-20 bg-gradient-to-r from-green-400 to-teal-500 rounded-full mb-3"></div>
                        <h3 class="font-bold text-gray-800 text-sm">森林守护者</h3>
                        <p class="text-xs text-gray-500">150 星星</p>
                    </div>
                    
                    <div class="character-card bg-gray-100 rounded-2xl p-4 flex flex-col items-center min-w-max">
                        <div class="w-20 h-20 bg-gradient-to-r from-amber-400 to-orange-500 rounded-full mb-3"></div>
                        <h3 class="font-bold text-gray-800 text-sm">火焰勇者</h3>
                        <p class="text-xs text-gray-500">200 星星</p>
                    </div>
                </div>
                
                <button class="w-full bg-gray-100 py-3 rounded-xl font-medium mt-2">
                    更换角色
                </button>
            </div>
        </div>
        
        <!-- 训练统计 -->
        <div class="card bg-white mb-6">
            <div class="p-5">
                <h2 class="font-bold text-xl text-gray-800 mb-4">训练统计</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-blue-50 p-4 rounded-xl">
                        <div class="text-3xl font-bold text-blue-600 text-center">87</div>
                        <p class="text-center text-sm text-gray-600">完成游戏</p>
                    </div>
                    <div class="bg-purple-50 p-4 rounded-xl">
                        <div class="text-3xl font-bold text-purple-600 text-center">12.5</div>
                        <p class="text-center text-sm text-gray-600">训练小时</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-xl">
                        <div class="text-3xl font-bold text-green-600 text-center">23%</div>
                        <p class="text-center text-sm text-gray-600">注意力提升</p>
                    </div>
                    <div class="bg-amber-50 p-4 rounded-xl">
                        <div class="text-3xl font-bold text-amber-600 text-center">7</div>
                        <p class="text-center text-sm text-gray-600">连续天数</p>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-medium">注意力训练</span>
                        <span>35次</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 70%"></div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-medium">记忆力训练</span>
                        <span>25次</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 50%"></div>
                    </div>
                </div>
                
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-medium">反应力训练</span>
                        <span>20次</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 40%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 设置菜单 -->
        <div class="card bg-white">
            <div class="p-1">
                <div class="menu-item flex items-center">
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-bell text-blue-600"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-medium text-gray-800">通知设置</h3>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="menu-item flex items-center">
                    <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-shield-alt text-purple-600"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-medium text-gray-800">隐私设置</h3>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="menu-item flex items-center">
                    <div class="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-question-circle text-amber-600"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-medium text-gray-800">帮助与反馈</h3>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="menu-item flex items-center">
                    <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-info-circle text-green-600"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-medium text-gray-800">关于小星专注力</h3>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
                
                <div class="menu-item flex items-center">
                    <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-sign-out-alt text-red-600"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-medium text-gray-800">退出登录</h3>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bg-white border-t border-gray-200 py-3 px-8 flex justify-around fixed bottom-0 w-full max-w-[500px]">
        <a href="index.html" class="text-gray-500 flex flex-col items-center">
            <i class="fas fa-home text-lg"></i>
            <span class="text-xs mt-1">首页</span>
        </a>
        <a href="plan.html" class="text-gray-500 flex flex-col items-center">
            <i class="fas fa-calendar-alt text-lg"></i>
            <span class="text-xs mt-1">计划</span>
        </a>
        <a href="games.html" class="text-gray-500 flex flex-col items-center">
            <i class="fas fa-gamepad text-lg"></i>
            <span class="text-xs mt-1">游戏</span>
        </a>
        <a href="parent.html" class="text-gray-500 flex flex-col items-center">
            <i class="fas fa-user-friends text-lg"></i>
            <span class="text-xs mt-1">家长</span>
        </a>
        <a href="profile.html" class="text-primary flex flex-col items-center">
            <i class="fas fa-user text-lg"></i>
            <span class="text-xs mt-1">我的</span>
        </a>
    </nav>

    <!-- 星星奖励浮动按钮 -->
    <a href="store.html" class="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-gradient-to-r from-yellow-400 to-amber-500 flex items-center justify-center text-white floating-action">
        <i class="fas fa-star text-xl"></i>
    </a>

    <script>
        // 角色选择交互
        const characterCards = document.querySelectorAll('.character-card');
        characterCards.forEach(card => {
            card.addEventListener('click', function() {
                characterCards.forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                
                if (!this.classList.contains('selected')) {
                    alert('是否要购买此角色？');
                }
            });
        });
        
        // 菜单项交互
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function() {
                const text = this.querySelector('h3').textContent;
                alert(`打开：${text}`);
            });
        });
        
        // 星星按钮动画
        const starBtn = document.querySelector('.floating-action');
        starBtn.addEventListener('click', function(e) {
            e.preventDefault();
            alert('打开星星商城！');
        });
        
        // 徽章动画效果
        const badgeCards = document.querySelectorAll('.badge-card:not(.bg-gray-100)');
        badgeCards.forEach((badge, index) => {
            setTimeout(() => {
                badge.classList.add('fade-in');
            }, 100 * index);
        });
    </script>
</body>
</html>
