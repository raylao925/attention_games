<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appName">小星專注力</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@21.6.10/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@7.0.1/dist/umd/i18nextBrowserLanguageDetector.min.js"></script>
    <style>
        /* 高對比度模式 */
        .high-contrast {
            --text-color: #FFFFFF;
            --bg-color: #000000;
            --primary-color: #FFFF00;
            --secondary-color: #00FFFF;
            --accent-color: #FF00FF;
        }

        .high-contrast body {
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        .high-contrast .game-card {
            border: 2px solid var(--primary-color);
        }

        .high-contrast .floating-btn {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        /* 鍵盤導航焦點樣式 */
        *:focus {
            outline: 3px solid #4F46E5;
            outline-offset: 2px;
        }

        .high-contrast *:focus {
            outline: 3px solid var(--primary-color);
        }

        /* 跳過導航連結 */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #4F46E5;
            color: white;
            padding: 8px;
            z-index: 100;
        }

        .skip-link:focus {
            top: 0;
        }

        /* 遊戲容器樣式 */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
        }

        /* 遊戲控制按鈕 */
        .game-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            display: flex;
            gap: 10px;
        }

        .game-control-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-control-btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.1);
        }

        .high-contrast .game-control-btn {
            background: var(--primary-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body class="bg-background">
    <!-- 跳過導航連結 -->
    <a href="#main-content" class="skip-link" data-i18n="skipToContent">跳過導航</a>

    <!-- 頂部導航欄 -->
    <header class="header-gradient text-white p-5 pt-6 pb-6" role="banner">
        <div class="flex items-center justify-between mb-4">
            <a href="index.html" class="p-2 rounded-full bg-white bg-opacity-20" aria-label="返回主頁">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
            </a>
            <h1 class="text-xl font-bold" data-i18n="appName">小星專注力</h1>
            <button id="contrastToggle" class="p-2 rounded-full bg-white bg-opacity-20" aria-label="切換高對比度模式">
                <i class="fas fa-adjust" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main id="main-content" role="main">
        <!-- 遊戲分類按鈕 -->
        <div class="flex justify-center space-x-4 mb-8" role="tablist" aria-label="遊戲分類">
            <button class="category-btn active px-4 py-2 rounded-full bg-primary text-white" 
                    role="tab"
                    aria-selected="true"
                    aria-controls="all-games"
                    tabindex="0">
                全部遊戲
            </button>
            <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700"
                    role="tab"
                    aria-selected="false"
                    aria-controls="focus-games"
                    tabindex="0">
                專注力
            </button>
            <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700"
                    role="tab"
                    aria-selected="false"
                    aria-controls="memory-games"
                    tabindex="0">
                記憶力
            </button>
            <button class="category-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700"
                    role="tab"
                    aria-selected="false"
                    aria-controls="reaction-games"
                    tabindex="0">
                反應力
            </button>
        </div>

        <!-- 遊戲列表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4" role="tabpanel" id="all-games">
            <!-- 專注力遊戲卡片 -->
            <div class="game-card bg-white p-4 rounded-lg shadow-md cursor-pointer"
                 data-game-type="focus"
                 role="button"
                 tabindex="0"
                 aria-label="專注力訓練遊戲"
                 onkeypress="if(event.key === 'Enter') this.click()">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center mr-4">
                        <i class="fas fa-bullseye text-blue-500 text-2xl" aria-hidden="true"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800" data-i18n="focusGame">專注力訓練</h2>
                        <p class="text-sm text-gray-600" data-i18n="focusGameDesc">提升注意力集中能力</p>
                    </div>
                </div>
            </div>

            <!-- 記憶力遊戲卡片 -->
            <div class="game-card bg-white p-4 rounded-lg shadow-md cursor-pointer"
                 data-game-type="memory"
                 role="button"
                 tabindex="0"
                 aria-label="記憶力訓練遊戲"
                 onkeypress="if(event.key === 'Enter') this.click()">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full bg-purple-100 flex items-center justify-center mr-4">
                        <i class="fas fa-brain text-purple-500 text-2xl" aria-hidden="true"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800" data-i18n="memoryGame">記憶力訓練</h2>
                        <p class="text-sm text-gray-600" data-i18n="memoryGameDesc">增強短期記憶能力</p>
                    </div>
                </div>
            </div>

            <!-- 反應力遊戲卡片 -->
            <div class="game-card bg-white p-4 rounded-lg shadow-md cursor-pointer"
                 data-game-type="reaction"
                 role="button"
                 tabindex="0"
                 aria-label="反應力訓練遊戲"
                 onkeypress="if(event.key === 'Enter') this.click()">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mr-4">
                        <i class="fas fa-bolt text-green-500 text-2xl" aria-hidden="true"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800" data-i18n="reactionGame">反應力訓練</h2>
                        <p class="text-sm text-gray-600" data-i18n="reactionGameDesc">提升反應速度和準確性</p>
                    </div>
                </div>
            </div>

            <!-- 靈活性遊戲卡片 -->
            <div class="game-card bg-white p-4 rounded-lg shadow-md cursor-pointer"
                 data-game-type="flexibility"
                 role="button"
                 tabindex="0"
                 aria-label="靈活性訓練遊戲"
                 onkeypress="if(event.key === 'Enter') this.click()">
                <div class="flex items-center">
                    <div class="w-16 h-16 rounded-full bg-yellow-100 flex items-center justify-center mr-4">
                        <i class="fas fa-random text-yellow-500 text-2xl" aria-hidden="true"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-gray-800" data-i18n="flexibilityGame">靈活性訓練</h2>
                        <p class="text-sm text-gray-600" data-i18n="flexibilityGameDesc">提升認知靈活性和適應能力</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 遊戲容器 -->
    <div id="game-container" role="application" aria-label="遊戲區域"></div>

    <!-- 遊戲控制按鈕 -->
    <div class="game-controls" role="toolbar" aria-label="遊戲控制">
        <button class="game-control-btn" id="pauseBtn" aria-label="暫停遊戲">
            <i class="fas fa-pause" aria-hidden="true"></i>
        </button>
        <button class="game-control-btn" id="soundBtn" aria-label="切換音效">
            <i class="fas fa-volume-up" aria-hidden="true"></i>
        </button>
        <button class="game-control-btn" id="fullscreenBtn" aria-label="切換全螢幕">
            <i class="fas fa-expand" aria-hidden="true"></i>
        </button>
    </div>

    <!-- 底部導航 -->
    <div id="footer-container" role="contentinfo"></div>

    <script src="js/footer.js"></script>
    <script>
        // 高對比度模式切換
        document.getElementById('contrastToggle').addEventListener('click', function() {
            document.body.classList.toggle('high-contrast');
            const isHighContrast = document.body.classList.contains('high-contrast');
            localStorage.setItem('highContrast', isHighContrast);
            this.setAttribute('aria-pressed', isHighContrast);
        });

        // 檢查並應用保存的高對比度設置
        if (localStorage.getItem('highContrast') === 'true') {
            document.body.classList.add('high-contrast');
            document.getElementById('contrastToggle').setAttribute('aria-pressed', 'true');
        }

        // 遊戲分類切換
        document.querySelectorAll('.category-btn').forEach(button => {
            button.addEventListener('click', function() {
                // 更新按鈕狀態
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.remove('active', 'bg-primary', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                    btn.setAttribute('aria-selected', 'false');
                });
                this.classList.add('active', 'bg-primary', 'text-white');
                this.classList.remove('bg-gray-200', 'text-gray-700');
                this.setAttribute('aria-selected', 'true');

                // 過濾遊戲卡片
                const category = this.getAttribute('aria-controls');
                document.querySelectorAll('.game-card').forEach(card => {
                    if (category === 'all-games' || card.getAttribute('data-game-type') === category.split('-')[0]) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });

        // 遊戲卡片點擊事件
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', function() {
                const gameType = this.getAttribute('data-game-type');
                const gameContainer = document.getElementById('game-container');
                gameContainer.style.display = 'block';
                
                // 初始化遊戲
                const config = {
                    type: Phaser.AUTO,
                    width: window.innerWidth,
                    height: window.innerHeight,
                    parent: 'game-container',
                    scene: null
                };

                switch(gameType) {
                    case 'focus':
                        config.scene = FocusGameScene;
                        break;
                    case 'memory':
                        config.scene = MemoryGameScene;
                        break;
                    case 'reaction':
                        config.scene = ReactionGameScene;
                        break;
                    case 'flexibility':
                        config.scene = FlexibilityGameScene;
                        break;
                }

                const game = new Phaser.Game(config);
            });
        });

        // 遊戲控制按鈕事件
        document.getElementById('pauseBtn').addEventListener('click', function() {
            const game = window.game;
            if (game) {
                if (game.scene.isPaused()) {
                    game.scene.resume();
                    this.setAttribute('aria-label', '暫停遊戲');
                    this.querySelector('i').className = 'fas fa-pause';
                } else {
                    game.scene.pause();
                    this.setAttribute('aria-label', '繼續遊戲');
                    this.querySelector('i').className = 'fas fa-play';
                }
            }
        });

        document.getElementById('soundBtn').addEventListener('click', function() {
            const game = window.game;
            if (game) {
                const isMuted = game.sound.mute;
                game.sound.mute = !isMuted;
                this.setAttribute('aria-label', isMuted ? '開啟音效' : '關閉音效');
                this.querySelector('i').className = isMuted ? 'fas fa-volume-up' : 'fas fa-volume-mute';
            }
        });

        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            const gameContainer = document.getElementById('game-container');
            if (!document.fullscreenElement) {
                gameContainer.requestFullscreen();
                this.setAttribute('aria-label', '退出全螢幕');
                this.querySelector('i').className = 'fas fa-compress';
            } else {
                document.exitFullscreen();
                this.setAttribute('aria-label', '切換全螢幕');
                this.querySelector('i').className = 'fas fa-expand';
            }
        });

        // 鍵盤快捷鍵
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const gameContainer = document.getElementById('game-container');
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                    document.getElementById('fullscreenBtn').setAttribute('aria-label', '切換全螢幕');
                    document.getElementById('fullscreenBtn').querySelector('i').className = 'fas fa-expand';
                }
            }
        });
    </script>
</body>
</html>
