<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="memoryGame">記憶大師</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@21.6.10/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@7.0.1/dist/umd/i18nextBrowserLanguageDetector.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #F9FAFB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
        }
        #game-container {
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .game-header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #4F46E5 0%, #818CF8 100%);
            color: white;
            margin-bottom: 20px;
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #4F46E5;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-button:hover {
            background: #4338CA;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left mr-2"></i><span data-i18n="back">返回主頁</span>
    </a>
    
    <div class="game-header">
        <h1 class="text-2xl font-bold" data-i18n="memoryGame">記憶大師</h1>
        <p class="text-sm opacity-80" data-i18n="rememberPattern">記住出現的圖案順序</p>
    </div>

    <!-- 語言切換按鈕 -->
    <div class="fixed top-4 right-4 z-50">
        <button id="languageSwitch" class="bg-white bg-opacity-20 p-2 rounded-full text-white">
            <i class="fas fa-globe"></i>
        </button>
    </div>

    <div id="game-container"></div>

    <!-- 遊戲相關腳本 -->
    <script src="js/i18n/config.js"></script>
    <script src="js/games/MemoryGame.js"></script>
    <script>
        // 語言切換功能
        document.getElementById('languageSwitch').addEventListener('click', () => {
            const currentLang = i18next.language;
            const newLang = currentLang === 'zh-TW' ? 'en' : 'zh-TW';
            i18next.changeLanguage(newLang);
            updateContent();
        });

        // 更新頁面內容
        function updateContent() {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                element.textContent = i18next.t(key);
            });
        }

        // 初始化時更新內容
        i18next.on('initialized', () => {
            updateContent();
        });

        // 初始化遊戲
        window.addEventListener('load', () => {
            const config = {
                type: Phaser.AUTO,
                parent: 'game-container',
                width: 800,
                height: 600,
                scene: MemoryGameScene,
                physics: {
                    default: 'arcade',
                    arcade: {
                        gravity: { y: 0 },
                        debug: false
                    }
                }
            };
            
            const game = new Phaser.Game(config);
        });
    </script>
</body>
</html>
